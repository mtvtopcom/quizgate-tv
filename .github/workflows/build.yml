name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 build-tools 与 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0" "platforms;android-35" > /dev/null || true

      - name: 构建（调试签名，仅验证可编译）
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 断言不含 INTERNET 权限
        run: |
          APK=$(ls build/*.apk | head -1)
          if "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK 声明了 INTERNET 权限，与本项目的隐私承诺冲突"
            exit 1
          fi
          echo "OK: 无 INTERNET 权限"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/*.apk

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查每个 commit 的 Signed-off-by
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          fail=0
          for sha in $(git rev-list "$base"..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -qi "^Signed-off-by: .\+ <.\+@.\+>"; then
              echo "::error::commit $sha 缺少 Signed-off-by（请用 git commit -s）"
              fail=1
            fi
          done
          exit $fail
